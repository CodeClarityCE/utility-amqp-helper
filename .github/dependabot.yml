version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    cooldown:
      default-days: 3
    ignore:
      # Bumped only by the cascading release script.
      - dependency-name: "github.com/CodeClarityCE/*"
      # bun 1.3.0 mangles escaped backslashes in JSON writes (uptrace/bun#1472); the fix ships after it.
      - dependency-name: "github.com/uptrace/bun*"
        versions: ["1.3.0"]
    groups:
      go:
        patterns: ["*"]
